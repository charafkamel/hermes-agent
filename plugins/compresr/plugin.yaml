name: compresr
version: 1.0.0
kind: backend
description: >-
  Context and tool-output compression via Compresr. Thin shim over the
  `compresr` PyPI SDK; fail-open, inert without an API key.
author: Compresr
homepage: https://compresr.ai
requires_env:
  - name: COMPRESR_API_KEY
    description: "Compresr API key (starts with cmp_)"
    url: "https://compresr.ai"
    secret: true
